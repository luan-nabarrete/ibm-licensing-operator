apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ibm-license-service
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  sources:
    - repoURL: "https://github.com/luan-nabarrete/ibm-licensing-operator"
      targetRevision: "latest-4.x"
      path: deploy/argo-cd/components/license-service/helm-cluster-scoped
      helm:
        valueFiles:
          - 'values.yaml'
    - repoURL: "https://github.com/luan-nabarrete/ibm-licensing-operator"
      targetRevision: "latest-4.x"
      path: deploy/argo-cd/prerequisites/licensing